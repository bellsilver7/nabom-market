name: nabom merket CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 3. Gradle 실행 권한 부여
      # - name: Grant execute permission
      #   run: chmod +x gradlew

      # 4. 빌드 및 테스트
      - name: Build and Test
        run: ./gradlew invalid-task
